name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry install
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: us-east-1
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push API image
        run: |
          IMAGE=atlas-api
          docker build -t $IMAGE:latest -f services/api/Dockerfile .
          docker tag $IMAGE:latest ${{ env.ECR_REGISTRY }}/$IMAGE:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/$IMAGE:${{ github.sha }}
      - name: Build and push Worker image
        run: |
          IMAGE=atlas-worker
          docker build -t $IMAGE:latest -f services/worker/Dockerfile .
          docker tag $IMAGE:latest ${{ env.ECR_REGISTRY }}/$IMAGE:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/$IMAGE:${{ github.sha }}
      - name: Build and push Frontend image
        run: |
          IMAGE=atlas-frontend
          docker build -t $IMAGE:latest -f services/frontend/Dockerfile services/frontend
          docker tag $IMAGE:latest ${{ env.ECR_REGISTRY }}/$IMAGE:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/$IMAGE:${{ github.sha }}
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=atlas/dev/terraform.tfstate" -backend-config="region=us-east-1"
      - name: Terraform apply (dev)
        working-directory: infra/terraform
        run: terraform apply -auto-approve -var-file=envs/dev/terraform.tfvars
      - name: ECS deploy
        run: aws ecs update-service --cluster atlas-knowledge-dev --service atlas-api-dev --force-new-deployment
