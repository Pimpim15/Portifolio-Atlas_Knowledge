global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: worker
    static_configs:
      - targets:
          - worker:9000

  - job_name: elasticsearch_exporter
    static_configs:
      - targets:
          - es_exporter:9114
