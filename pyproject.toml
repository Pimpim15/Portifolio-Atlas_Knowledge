[tool.poetry]
name = "atlas-knowledge"
version = "0.1.0"
description = "Monorepo do Atlas Knowledge"
authors = ["Seu Nome <email@example.com>"]
readme = "README.md"
packages = [
  { include = "services/api", from = "." },
  { include = "services/worker", from = "." },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = { version = "^0.111.0", extras = ["standard"] }
uvicorn = { version = "^0.30.0", extras = ["standard"] }
sqlalchemy = "^2.0.29"
psycopg = { version = "^3.1.18", extras = ["binary"] }
aiosqlite = "^0.20.0"
asyncpg = "^0.29.0"
pydantic-settings = "^2.4.0"
python-jose = "^3.3.0"
passlib = "^1.7.4"
redis = "^5.0.4"
slowapi = "^0.1.9"
structlog = "^24.1.0"
opensearch-py = "^2.5.0"
httpx = "^0.27.0"
fastapi-limiter = "^0.1.6"
opentelemetry-sdk = "^1.24.0"
opentelemetry-exporter-otlp = "^1.24.0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
opentelemetry-instrumentation-sqlalchemy = "^0.45b0"
prometheus-client = "^0.20.0"
alembic = "^1.13.1"
boto3 = "^1.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.6"
pytest-mock = "^3.14.0"
ruff = "^0.6.4"
mypy = "^1.10.0"
aresponses = "^2.1.6"
testcontainers = { version = "^4.5.0", extras = ["postgresql", "redis"] }
locust = "^2.26.0"
pip-audit = "^2.7.4"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["services/api/atlas_api"]
branch = true

[tool.coverage.report]
omit = [
  "tests/*",
  "*/__init__.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"services/api/atlas_api/deps.py" = ["B008"]
"services/api/atlas_api/routes/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
packages = ["services.api.atlas_api"]
ignore_missing_imports = true
